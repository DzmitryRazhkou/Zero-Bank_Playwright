name: Playwright Tests Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-playwright-tests:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: yarn install

      # Step 4: Install Playwright browsers
      - name: Install Playwright browsers
        run: yarn add @playwright/test@latest --dev

      # Step 5: Run Playwright tests (with retries and parallel execution as defined in Playwright config)
      - name: Run Playwright tests
        env:
          CI: true
        run: |
          set -e
          yarn sof-v2

      # Step 6: Upload Playwright HTML report
      - name: Upload Playwright Test Report
        if: always() # Ensure this runs regardless of the test outcome (success/failure)
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      # Step 7: Upload any screenshots or videos from test failures for debugging
      - name: Upload Playwright Artifacts (Screenshots & Videos)
        if: failure() # Only upload if there are test failures
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/ # Update this if screenshots or videos are stored elsewhere
