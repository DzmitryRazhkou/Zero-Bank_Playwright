name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  zero-bank-tests_sof:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install system dependencies for Playwright browsers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwoff1 \
            libvpx7 \
            libevent-2.1-7 \
            libopus0 \
            libgstapp1.0-0 \
            libgstpbutils1.0-0 \
            libgstaudio1.0-0 \
            libgsttag1.0-0 \
            libgstvideo1.0-0 \
            libgstgl1.0-0 \
            libgstmpegts1.0-0 \
            libgstsdp1.0-0 \
            libharfbuzz-icu0 \
            libhyphen0 \
            libx264-160 \
            libflite1 \
            libflite1-dev \
            libGLESv2-2

      - name: Install dependencies
        run: yarn install

      - name: Install Playwright Browsers
        run: yarn playwright install

      - name: Run Playwright Tests (Firefox)
        env:
          CI: true
        run: |
          set -e
          yarn sof-v2 || true

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
